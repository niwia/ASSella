# Ruff configuration for ASSella.
#
# target-version matches the Python used in CI (.github/workflows/ci.yml) and
# the AppImage runtime. Keeping it in one place avoids ruff flagging valid
# 3.12+ f-string syntax as a syntax error.
target-version = "py313"
line-length = 120
exclude = ["src/deps", ".venv", "__pycache__"]

[lint]
# F821 undefined-name / F823 use-before-assignment / F811 redefinition.
# These are the classes of bug that pass compileall and then raise NameError at
# runtime, so they are enforced in CI rather than left as advisory output.
#
# TC003 flags a `typing` import used only inside a TYPE_CHECKING block. That is
# sound on its own, but it hides a real hazard: a name imported that way and then
# *called* at runtime raises NameError, which no static rule can see. TC003 keeps
# those imports visible so the runtime use is obvious in review.
select = ["F821", "F823", "F811", "TC003"]

[lint.per-file-ignores]
# Modules outside the current lint scope. Each still contains real undefined
# names that are tracked separately; they are excluded here so the F821 gate
# stays enforceable for the rest of the tree.
"src/core/tasks/native_steam_download_task.py" = ["F821"]
"src/managers/task_manager.py" = ["F821"]
"src/utils/assfixer.py" = ["F821"]