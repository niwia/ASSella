name: Feature Request
description: Suggest an idea or enhancement for ASSella.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing a feature! Please check existing issues and our [Roadmap](https://github.com/niwia/ASSella/projects) first to see if this is already planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation you are facing?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe what you would like to see happen and how the user experience should work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative workflows, workarounds, or tools you have evaluated.
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any screenshots, mockups, or extra references.
