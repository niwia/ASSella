name: Build and Release AppImage

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'ci-test'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release Channel (stable, beta, canary)'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - canary
          - stable
      draft:
        description: 'Mark as Draft Release'
        required: true
        default: true
        type: boolean
      publish:
        description: 'Publish Release (if false, builds & tests artifacts without releasing)'
        required: true
        default: false
        type: boolean
      run_preflight:
        description: 'Run the pre-release verification suite against the built AppImage'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  meta:
    name: Determine Metadata & Changelog
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      channel: ${{ steps.meta.outputs.channel }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      draft: ${{ steps.meta.outputs.draft }}
      publish: ${{ steps.meta.outputs.publish }}
      update_tag: ${{ steps.meta.outputs.update_tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Channel & Metadata
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME:-}"
          if [ -z "$TAG" ] || [ "$TAG" = "beta" ] || [ "$TAG" = "canary" ] || [ "$TAG" = "main" ]; then
            TAG="v$(cat src/res/version 2>/dev/null || echo '2.7.1dev')"
          fi

          LOWER_TAG=$(echo "$TAG" | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${{ github.event.inputs.channel }}"
            if [ "$CHANNEL" = "stable" ]; then
              IS_PRE="false"
            else
              IS_PRE="true"
            fi
          elif echo "$LOWER_TAG" | grep -q -E 'canary|testing'; then
            CHANNEL="canary"
            IS_PRE="true"
          elif echo "$LOWER_TAG" | grep -q -E 'beta|dev|rc'; then
            CHANNEL="beta"
            IS_PRE="true"
          else
            CHANNEL="stable"
            IS_PRE="false"
          fi

          DRAFT="true"
          PUBLISH="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DRAFT="${{ github.event.inputs.draft }}"
            PUBLISH="${{ github.event.inputs.publish }}"
          elif echo "${{ github.ref }}" | grep -q '^refs/tags/'; then
            PUBLISH="true"
          fi

          case "$CHANNEL" in
            stable) UPDATE_TAG="latest" ;;
            *)      UPDATE_TAG="latest-pre" ;;
          esac

          RELEASE_BODY_FILE="release_notes.md"
          if [ -f "docs/changelogs/${TAG}.md" ]; then
            cp "docs/changelogs/${TAG}.md" "$RELEASE_BODY_FILE"
          elif [ -f "docs/changelogs/${TAG#v}.md" ]; then
            cp "docs/changelogs/${TAG#v}.md" "$RELEASE_BODY_FILE"
          else
            echo "Release ${TAG} (${CHANNEL} channel)" > "$RELEASE_BODY_FILE"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "prerelease=$IS_PRE" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "update_tag=$UPDATE_TAG" >> "$GITHUB_OUTPUT"
          echo "Metadata resolved: Tag=$TAG, Channel=$CHANNEL, Pre-release=$IS_PRE, Draft=$DRAFT, Publish=$PUBLISH, UpdateTag=$UPDATE_TAG"

      - name: Upload Release Notes Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md

  build:
    name: Build Native AppImage (${{ matrix.arch }})
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            tool_arch: x86_64
            appimage_name: ASSella.AppImage
          - os: ubuntu-24.04-arm
            arch: aarch64
            tool_arch: aarch64
            appimage_name: ASSella-arm64.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install System Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zsync squashfs-tools wget curl file python3-venv python3-pip git libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3 zip
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64 || true

      - name: Download and Setup appimagetool
        run: |
          TOOL_URL="https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.tool_arch }}.AppImage"
          wget -q "$TOOL_URL" -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          sudo mv squashfs-root /opt/appimagetool
          sudo ln -s /opt/appimagetool/AppRun /usr/local/bin/appimagetool

      - name: Assemble AppDir
        run: |
          set -e
          exec > >(tee /tmp/assemble.log) 2>&1
          set -x
          mkdir -p AppDir/bin

          # 1. Desktop Entry & Icon
          cat << 'EOF' > AppDir/assella.desktop
          [Desktop Entry]
          Name=ASSella
          Comment=Steam Game & Depot Management Suite
          Exec=AppRun %U
          Icon=assella
          Terminal=false
          Type=Application
          Categories=Utility;Game;
          StartupWMClass=ASSella
          EOF
          cp AppDir/assella.desktop AppDir/ACCELA.desktop

          # Copy icons: bundle scalable SVG alongside PNG fallback
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          if [ -f "src/res/logo/icon.svg" ]; then
            cp "src/res/logo/icon.svg" AppDir/assella.svg
            cp "src/res/logo/icon.svg" AppDir/accela.svg
            cp "src/res/logo/icon.svg" AppDir/usr/share/icons/hicolor/scalable/apps/assella.svg
          fi
          if [ -f "src/res/logo/icon.png" ]; then
            cp "src/res/logo/icon.png" AppDir/assella.png
            cp "src/res/logo/icon.png" AppDir/.DirIcon
            cp "src/res/logo/icon.png" AppDir/usr/share/icons/hicolor/256x256/apps/assella.png
          elif [ -f "src/res/logo/accela.png" ]; then
            cp "src/res/logo/accela.png" AppDir/assella.png
            cp "src/res/logo/accela.png" AppDir/.DirIcon
            cp "src/res/logo/accela.png" AppDir/usr/share/icons/hicolor/256x256/apps/assella.png
          elif [ -f "assela_logo.png" ]; then
            cp "assela_logo.png" AppDir/assella.png
            cp "assela_logo.png" AppDir/.DirIcon
            cp "assela_logo.png" AppDir/usr/share/icons/hicolor/256x256/apps/assella.png
          fi
          [ -f AppDir/assella.png ] && cp AppDir/assella.png AppDir/accela.png

          # 2. AppRun Script
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          cd "$HERE/bin"

          # 1. Wayland & Gamescope compatibility (prefer Wayland in Game Mode, fallback to XCB in Desktop Mode)
          export QT_QPA_PLATFORM="${QT_QPA_PLATFORM:-wayland;xcb}"

          # 2. QtWebEngine / Chromium sandbox guard for FUSE mounts
          export QTWEBENGINE_DISABLE_SANDBOX=1

          # 3. Prioritise bundled self-contained .NET 9 runtime
          export DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
          if [ -d "$HERE/bin/.dotnet" ]; then
              export DOTNET_ROOT="$HERE/bin/.dotnet"
              export PATH="$HERE/bin/.dotnet:${PATH}"
          elif [ -d "${HOME}/.dotnet" ]; then
              export DOTNET_ROOT="${HOME}/.dotnet"
              export PATH="${HOME}/.dotnet:${PATH}"
          fi

          export APPIMAGE=1
          exec "./run.sh" "$@"
          EOF
          chmod +x AppDir/AppRun

          # 3. Bin run.sh
          cat << 'EOF' > AppDir/bin/run.sh
          #!/usr/bin/env bash
          cd "$(dirname "$(realpath "$0")")"
          export APPIMAGE=1
          export QT_QPA_PLATFORM="${QT_QPA_PLATFORM:-wayland;xcb}"

          PYTHON_EXEC=".venv/bin/python3"
          if [ -f "$PYTHON_EXEC" ]; then
              exec "$PYTHON_EXEC" src/main.py "$@"
          else
              exec python3 src/main.py "$@"
          fi
          EOF
          chmod +x AppDir/bin/run.sh

          # 4. Copy Application Source Code
          cp -r src AppDir/bin/
          find AppDir/bin/src -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          rm -rf AppDir/bin/src/deps/Goldberg AppDir/bin/src/deps/Steamless AppDir/bin/src/deps/SLScheevo AppDir/bin/src/deps/schema-grabber AppDir/bin/src/deps/wireproxy AppDir/bin/src/data/steam_headers.db
          rm -rf AppDir/bin/src/res/jumpscare AppDir/bin/src/res/intro
          BUILD_DATE_UTC="$(date -u +%Y-%m-%d)"
          BUILD_TS_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 -c 'import re, sys; p = "AppDir/bin/src/utils/version.py"; t = open(p, "r", encoding="utf-8").read(); t = re.sub(r"^BUILD_DATE\s*=.*$", f"BUILD_DATE = \"{sys.argv[1]}\"", t, flags=re.M); t = re.sub(r"^BUILD_TIMESTAMP\s*=.*$", f"BUILD_TIMESTAMP = \"{sys.argv[2]}\"", t, flags=re.M); open(p, "w", encoding="utf-8").write(t); print(f"Stamped {p}: {sys.argv[1]} / {sys.argv[2]}")' "$BUILD_DATE_UTC" "$BUILD_TS_UTC"

          # 5. Bundle appimageupdatetool
          if [ ! -f "AppDir/bin/appimageupdatetool" ]; then
            echo "Downloading appimageupdatetool for ${{ matrix.tool_arch }}..."
            curl -fsSL --retry 3 -o /tmp/appimageupdatetool \
              "https://github.com/AppImageCommunity/AppImageUpdate/releases/download/continuous/appimageupdatetool-${{ matrix.tool_arch }}.AppImage" \
              || curl -fsSL --retry 3 -o /tmp/appimageupdatetool \
              "https://github.com/AppImage/appimageupdatetool/releases/download/continuous/appimageupdatetool-${{ matrix.tool_arch }}.AppImage"
            chmod +x /tmp/appimageupdatetool
            if ! /tmp/appimageupdatetool --appimage-extract >/dev/null 2>&1; then
              echo "::error::appimageupdatetool failed extraction — refusing to ship"
              exit 1
            fi
            mkdir -p AppDir/bin/appimageupdatetool-root/usr
            cp -r squashfs-root/usr/bin AppDir/bin/appimageupdatetool-root/usr/bin
            cp -r squashfs-root/usr/lib AppDir/bin/appimageupdatetool-root/usr/lib
            cp squashfs-root/.DirIcon AppDir/bin/appimageupdatetool-root/.DirIcon 2>/dev/null || true
            rm -rf squashfs-root
            printf '#!/bin/sh\n# Resolves its own location so the AppDir can be moved anywhere.\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/appimageupdatetool-root/usr/bin/appimageupdatetool" "$@"\n' > AppDir/bin/appimageupdatetool
            chmod +x AppDir/bin/appimageupdatetool
            if ! AppDir/bin/appimageupdatetool --version >/dev/null 2>&1; then
              echo "::error::Bundled appimageupdatetool fails to execute — delta updates would silently fall back"
              exit 1
            fi
            echo "appimageupdatetool bundled and verified executable."
          fi

          # 6. Bundle zsync2
          if [ ! -f "AppDir/bin/zsync" ]; then
            echo "Downloading zsync2 for ${{ matrix.tool_arch }}..."
            curl -fsSL --retry 3 -o /tmp/zsync2 \
              "https://github.com/AppImageCommunity/zsync2/releases/download/2.0.0-alpha-1-20250926/zsync2-93-fc62ae7-${{ matrix.tool_arch }}.AppImage" \
              || curl -fsSL --retry 3 -o /tmp/zsync2 \
              "https://github.com/AppImage/zsync2/releases/download/2.0.0-alpha-1-20250926/zsync2-93-fc62ae7-${{ matrix.tool_arch }}.AppImage"
            chmod +x /tmp/zsync2
            if ! /tmp/zsync2 --appimage-extract >/dev/null 2>&1; then
              echo "::error::zsync2 failed extraction — refusing to ship"
              exit 1
            fi
            mkdir -p AppDir/bin/zsync2-root/usr
            cp -r squashfs-root/usr/bin AppDir/bin/zsync2-root/usr/bin
            cp -r squashfs-root/usr/lib AppDir/bin/zsync2-root/usr/lib
            rm -rf squashfs-root
            printf '#!/bin/sh\n# Resolves its own location so the AppDir can be moved anywhere.\nHERE="$(dirname "$(readlink -f "$0")")"\nexport LD_LIBRARY_PATH="$HERE/zsync2-root/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"\nexec "$HERE/zsync2-root/usr/bin/zsync2" "$@"\n' > AppDir/bin/zsync
            chmod +x AppDir/bin/zsync
            if ! AppDir/bin/zsync -V >/dev/null 2>&1; then
              echo "::error::Bundled zsync2 fails to execute — delta updates would silently fall back"
              exit 1
            fi
            echo "zsync2 bundled as AppDir/bin/zsync and verified executable."
          fi

          # 7. Bundle Relocatable Standalone Python 3.13 Runtime
          echo "Downloading relocatable python-build-standalone runtime for ${{ matrix.arch }}..."
          curl -fsSL --retry 3 -o /tmp/cpython-standalone.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/20261026/cpython-3.13.18+20261026-${{ matrix.arch }}-unknown-linux-gnu-install_only_stripped.tar.gz"
          tar -xzf /tmp/cpython-standalone.tar.gz -C AppDir/bin/
          mv AppDir/bin/python AppDir/bin/.venv

          # 8. Install application dependencies into bundled runtime
          AppDir/bin/.venv/bin/python3 -m pip install --upgrade pip setuptools wheel
          AppDir/bin/.venv/bin/python3 -m pip install -r requirements.txt

          # 9. Prune unused Qt6 subsystems, QML, and translations (~60–80 MB saved)
          SITE_PKGS="AppDir/bin/.venv/lib/python3.13/site-packages"
          QT6_DIR="$SITE_PKGS/PyQt6/Qt6"
          echo "Pruning unused Qt6 subsystems, QML, and translations..."
          rm -rf "$QT6_DIR/qml" "$QT6_DIR/translations" "$QT6_DIR/qsci" \
                 "$QT6_DIR/plugins/sqldrivers" "$QT6_DIR/plugins/multimedia" \
                 "$QT6_DIR/plugins/sceneparsers" "$QT6_DIR/plugins/geometryloaders"

          find "$QT6_DIR/lib" -maxdepth 1 -name "libQt6*.so*" \
            ! -name "libQt6Core*" ! -name "libQt6Gui*" ! -name "libQt6Widgets*" \
            ! -name "libQt6DBus*" ! -name "libQt6Network*" ! -name "libQt6Svg*" \
            ! -name "libQt6Wayland*" ! -name "libQt6WlShellIntegration*" \
            ! -name "libQt6XcbQpa*" ! -name "libQt6OpenGL*" \
            -delete

          find "$SITE_PKGS/PyQt6" -maxdepth 1 \( -name "Qt*.so" -o -name "Qt*.pyi" \) \
            ! -name "QtCore*" ! -name "QtGui*" ! -name "QtWidgets*" \
            ! -name "QtNetwork*" ! -name "QtSvg*" ! -name "QtOpenGL*" \
            -delete
          rm -rf "$SITE_PKGS/PyQt6/bindings"

          # 10. Purge build tools and unused stdlib from relocatable runtime (~45 MB saved)
          echo "Purging build residue and unused stdlib modules from bundled runtime..."
          rm -rf AppDir/bin/.venv/lib/python3.13/ensurepip \
                 AppDir/bin/.venv/lib/python3.13/site-packages/pip* \
                 AppDir/bin/.venv/lib/python3.13/site-packages/setuptools* \
                 AppDir/bin/.venv/lib/python3.13/site-packages/wheel* \
                 AppDir/bin/.venv/bin/pip* \
                 AppDir/bin/.venv/bin/wheel* \
                 AppDir/bin/.venv/bin/ruff
          rm -rf AppDir/bin/.venv/include \
                 AppDir/bin/.venv/lib/python3.13/config-3.13-*-linux-gnu \
                 AppDir/bin/.venv/lib/python3.13/tkinter \
                 AppDir/bin/.venv/lib/python3.13/idlelib \
                 AppDir/bin/.venv/lib/python3.13/tcl* \
                 AppDir/bin/.venv/lib/python3.13/tk* \
                 AppDir/bin/.venv/lib/tcl* \
                 AppDir/bin/.venv/lib/tk* \
                 AppDir/bin/.venv/lib/Tix* \
                 AppDir/bin/.venv/lib/itcl* \
                 AppDir/bin/.venv/lib/thread* \
                 AppDir/bin/.venv/share/terminfo \
                 AppDir/bin/.venv/share/man
          find AppDir/bin/.venv -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find AppDir/bin/.venv -name "*.pyc" -delete 2>/dev/null || true

          # 11. Bundle Microsoft .NET 9 ARM64 Runtime (Zero Host Dependencies)
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            echo "Downloading official Microsoft .NET 9 runtime (linux-arm64)..."
            DOTNET_TAR="/tmp/dotnet-runtime-9.0-arm64.tar.gz"
            curl -fsSL --retry 3 "https://dotnetcli.azureedge.net/dotnet/Runtime/9.0.0/dotnet-runtime-9.0.0-linux-arm64.tar.gz" -o "$DOTNET_TAR" || \
            curl -fsSL --retry 3 "https://builds.dotnet.microsoft.com/dotnet/Runtime/9.0.0/dotnet-runtime-9.0.0-linux-arm64.tar.gz" -o "$DOTNET_TAR"
            mkdir -p AppDir/bin/.dotnet
            tar -xzf "$DOTNET_TAR" -C AppDir/bin/.dotnet
            chmod +x AppDir/bin/.dotnet/dotnet
            echo "Bundled .NET 9 ARM64 runtime."
          fi

          # 12. Sanity check: Verify all required imports inside bundled AppDir runtime
          echo "Verifying AppDir runtime imports..."
          QT_QPA_PLATFORM=offscreen AppDir/bin/.venv/bin/python3 -c "import PyQt6.QtCore, PyQt6.QtGui, PyQt6.QtWidgets, PyQt6.QtSvg, PyQt6.QtNetwork, requests, yaml, cryptography, Cryptodome, rich, vdf, steam, steam.client, zstandard, curl_cffi; app = PyQt6.QtWidgets.QApplication(['app', '-platform', 'offscreen']); print('AppDir verification: All critical dependencies imported and QApplication created successfully!')"
          test -x AppDir/bin/appimageupdatetool || { echo "::error::appimageupdatetool missing from AppDir"; exit 1; }
          echo "appimageupdatetool present and executable."
          if [ -f "AppDir/bin/zsync" ]; then
            AppDir/bin/zsync -V >/dev/null 2>&1 || \
              echo "::warning::Bundled zsync2 present but fails to execute"
            echo "zsync2 bundled and verified executable."
          fi

      - name: Upload Assemble AppDir Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: assemble-failure-log-${{ matrix.arch }}
          path: /tmp/assemble.log

      - name: Build AppImage with ZSync Update Information
        run: |
          CHANNEL="${{ needs.meta.outputs.channel }}"
          UPDATE_TAG="${{ needs.meta.outputs.update_tag }}"
          APPIMAGE_NAME="${{ matrix.appimage_name }}"
          UPDATE_INFO="gh-releases-zsync|niwia|ASSella|${UPDATE_TAG}|${APPIMAGE_NAME}.zsync"

          RUNTIME_FLAG=()
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            STATIC_RUNTIME="/tmp/runtime-aarch64"
            if [ ! -f "$STATIC_RUNTIME" ]; then
              curl -fsSL --retry 3 "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-aarch64" -o "$STATIC_RUNTIME" || \
              curl -fsSL --retry 3 "https://github.com/AppImageCommunity/type2-runtime/releases/download/continuous/runtime-aarch64" -o "$STATIC_RUNTIME" || true
            fi
            if [ -f "$STATIC_RUNTIME" ]; then
              RUNTIME_FLAG=("--runtime-file" "$STATIC_RUNTIME")
              echo "Using static FUSE3-compatible aarch64 runtime."
            fi
          fi

          echo "Channel: $CHANNEL"
          echo "Generating AppImage with update string: $UPDATE_INFO"
          ARCH=${{ matrix.arch }} appimagetool -n -u "$UPDATE_INFO" \
            --mksquashfs-opt -b --mksquashfs-opt 524288 \
            --mksquashfs-opt -Xcompression-level --mksquashfs-opt 19 \
            "${RUNTIME_FLAG[@]}" AppDir "$APPIMAGE_NAME"

          echo "Regenerating zsync index from final AppImage..."
          rm -f "${APPIMAGE_NAME}.zsync"
          zsyncmake -u "$APPIMAGE_NAME" -o "${APPIMAGE_NAME}.zsync" "$APPIMAGE_NAME"

          sha256sum "$APPIMAGE_NAME" > "${APPIMAGE_NAME}.sha256"
          sha256sum "${APPIMAGE_NAME}.zsync" > "${APPIMAGE_NAME}.zsync.sha256"

      - name: Verify Release Artifact Integrity
        run: |
          set -euo pipefail
          APPIMAGE_NAME="${{ matrix.appimage_name }}"
          echo "Cross-checking .zsync / .sha256 metadata against $APPIMAGE_NAME..."

          actual_size=$(stat -c%s "$APPIMAGE_NAME")
          actual_sha1=$(sha1sum "$APPIMAGE_NAME" | awk '{print $1}')

          zsync_size=$(grep -a -i '^Length:' "${APPIMAGE_NAME}.zsync" | awk '{print $2}' | tr -d '\r' || true)
          zsync_sha1=$(grep -a -i '^SHA-1:' "${APPIMAGE_NAME}.zsync" | awk '{print $2}' | tr -d '\r' || true)

          fail=0

          if [ -z "$zsync_size" ] || [ -z "$zsync_sha1" ]; then
            echo "::error::Could not parse Length/SHA-1 from ${APPIMAGE_NAME}.zsync - treating this build as corrupt."
            echo "::error::Parsed Length='${zsync_size}' SHA-1='${zsync_sha1}' (both must be non-empty)."
            fail=1
          fi

          if [ "$zsync_size" != "$actual_size" ]; then
            echo "::error::zsync Length mismatch — zsync=$zsync_size actual=$actual_size"
            fail=1
          else
            echo "OK  zsync Length  = $actual_size"
          fi

          if [ "$zsync_sha1" != "$actual_sha1" ]; then
            echo "::error::zsync SHA-1 mismatch — zsync=$zsync_sha1 actual=$actual_sha1"
            fail=1
          else
            echo "OK  zsync SHA-1   = $actual_sha1"
          fi

          if [ "$(awk '{print $1}' "${APPIMAGE_NAME}.sha256")" != "$(sha256sum "$APPIMAGE_NAME" | awk '{print $1}')" ]; then
            echo "::error::${APPIMAGE_NAME}.sha256 does not match the AppImage"
            fail=1
          else
            echo "OK  AppImage sha256 matches"
          fi

          ESCAPED_NAME=$(echo "$APPIMAGE_NAME" | sed 's/\./\\./g')
          if ! grep -a -qi "^Filename:[[:space:]]*${ESCAPED_NAME}[[:space:]]*$" "${APPIMAGE_NAME}.zsync"; then
            echo "::error::zsync Filename header does not match published asset name"
            fail=1
          else
            echo "OK  zsync Filename header"
          fi

          if ! grep -a -qi "^URL:[[:space:]]*${ESCAPED_NAME}[[:space:]]*$" "${APPIMAGE_NAME}.zsync"; then
            echo "::error::zsync URL header does not match published asset name"
            fail=1
          else
            echo "OK  zsync URL header"
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::Refusing to publish — delta updates would be corrupt."
            exit 1
          fi
          echo "All release artifacts are internally consistent."

      - name: Smoke Test the Built AppImage
        if: github.event.inputs.run_preflight != 'false'
        run: |
          set -euo pipefail
          APPIMAGE_NAME="${{ matrix.appimage_name }}"
          echo "::group::Extract AppImage"
          rm -rf AppDir_extract
          ./"$APPIMAGE_NAME" --appimage-extract > /dev/null
          mv squashfs-root AppDir_extract
          echo "::endgroup::"

          echo "::group::Verify bundled runtime and resources"
          test -x AppDir_extract/bin/appimageupdatetool \
            || { echo "::error::appimageupdatetool missing from AppImage"; exit 1; }
          if ! AppDir_extract/bin/appimageupdatetool --version >/dev/null 2>&1; then
            echo "::error::Bundled appimageupdatetool present but fails to execute (missing shared libs?)"
            exit 1
          fi
          echo "OK  appimageupdatetool executes"
          test -x AppDir_extract/bin/run.sh || { echo "::error::run.sh missing"; exit 1; }
          test -f AppDir_extract/assella.desktop || { echo "::error::assella.desktop missing"; exit 1; }
          test -f AppDir_extract/AppRun || { echo "::error::AppRun missing"; exit 1; }
          UPDATE_STR=$(grep -a -o 'gh-releases-zsync|[^[:cntrl:]]*' "$APPIMAGE_NAME" | head -1 || true)
          echo "Embedded update string: ${UPDATE_STR:-<none found>}"
          case "$UPDATE_STR" in
            gh-releases-zsync\|niwia\|ASSella\|*) echo "OK  update string present" ;;
            *) echo "::error::Update string missing or malformed - delta updates would break"; exit 1 ;;
          esac
          echo "::endgroup::"

          echo "::group::Import check inside the bundled interpreter"
          QT_QPA_PLATFORM=offscreen AppDir_extract/bin/.venv/bin/python3 - <<'PY'
          import importlib, sys
          mods = ["PyQt6.QtCore","PyQt6.QtWidgets","PyQt6.QtGui","PyQt6.QtSvg","PyQt6.QtNetwork","requests","yaml",
                  "cryptography","Cryptodome","rich","vdf","steam","steam.client",
                  "zstandard","curl_cffi","psutil","bs4","gevent","capstone"]
          bad = []
          for m in mods:
              try: importlib.import_module(m)
              except Exception as e: bad.append(f"{m}: {type(e).__name__}: {e}")
          if bad:
              print("::error::Bundled runtime cannot import:")
              [print("  -", b) for b in bad]
              sys.exit(1)
          print(f"All {len(mods)} bundled dependencies import cleanly.")
          PY
          echo "::endgroup::"

          echo "::group::Headless CLI smoke test against extracted AppImage"
          QT_QPA_PLATFORM=offscreen AppDir_extract/AppRun --headless --check-updates
          echo "::endgroup::"

      - name: Package Companion Source Code Archives
        if: matrix.arch == 'x86_64'
        run: |
          set -e
          TAG="${{ needs.meta.outputs.tag }}"
          PKG_NAME="ASSella-${TAG}-linux-source"
          echo "Packaging source distribution: ${PKG_NAME}"

          rm -rf "${PKG_NAME}" "${PKG_NAME}.tar.gz" "${PKG_NAME}.zip" "${PKG_NAME}.tar.gz.sha256" "${PKG_NAME}.zip.sha256"
          mkdir -p "${PKG_NAME}/bin"

          cp install.sh "${PKG_NAME}/"
          cp uninstall.sh "${PKG_NAME}/"
          chmod +x "${PKG_NAME}/install.sh" "${PKG_NAME}/uninstall.sh"

          cp requirements.txt "${PKG_NAME}/bin/"
          [ -f "src/res/logo/icon.svg" ] && cp "src/res/logo/icon.svg" "${PKG_NAME}/bin/icon.svg"
          if [ -f "src/res/logo/icon.png" ]; then
            cp "src/res/logo/icon.png" "${PKG_NAME}/bin/icon.png"
          elif [ -f "src/res/logo/accela.png" ]; then
            cp "src/res/logo/accela.png" "${PKG_NAME}/bin/icon.png"
          fi

          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'cd "$(dirname "$(realpath "$0")")"' \
            '' \
            'if [ -f ".venv/bin/python3" ]; then' \
            '    exec .venv/bin/python3 src/main.py "$@"' \
            'elif [ -f "../.venv/bin/python3" ]; then' \
            '    exec ../.venv/bin/python3 src/main.py "$@"' \
            'else' \
            '    exec python3 src/main.py "$@"' \
            'fi' > "${PKG_NAME}/bin/run.sh"
          chmod +x "${PKG_NAME}/bin/run.sh"

          cp -r src "${PKG_NAME}/bin/"
          find "${PKG_NAME}" -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find "${PKG_NAME}" -type f -name "*.pyc" -delete 2>/dev/null || true
          rm -rf "${PKG_NAME}/bin/src/deps/Goldberg" "${PKG_NAME}/bin/src/deps/Steamless" "${PKG_NAME}/bin/src/deps/SLScheevo" "${PKG_NAME}/bin/src/deps/schema-grabber" "${PKG_NAME}/bin/src/deps/wireproxy" "${PKG_NAME}/bin/src/data/steam_headers.db"
          rm -rf "${PKG_NAME}/bin/src/res/jumpscare" "${PKG_NAME}/bin/src/res/intro"

          tar -czf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          zip -qr "${PKG_NAME}.zip" "${PKG_NAME}"

          sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
          sha256sum "${PKG_NAME}.zip" > "${PKG_NAME}.zip.sha256"

          rm -rf "${PKG_NAME}"
          echo "Generated companion source archives:"
          ls -lh ASSella-*-linux-source.*

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.arch }}
          path: |
            ${{ matrix.appimage_name }}
            ${{ matrix.appimage_name }}.zsync
            ${{ matrix.appimage_name }}.sha256
            ${{ matrix.appimage_name }}.zsync.sha256
            ASSella-*-linux-source.tar.gz
            ASSella-*-linux-source.tar.gz.sha256
            ASSella-*-linux-source.zip
            ASSella-*-linux-source.zip.sha256
          if-no-files-found: warn

  publish:
    name: Publish Release & Mirror to R2
    needs: [meta, build]
    runs-on: ubuntu-24.04
    if: needs.meta.outputs.publish == 'true'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download Release Notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: ./

      - name: Download x86_64 Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-x86_64
          path: ./

      - name: Download ARM64 Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-aarch64
          path: ./

      - name: Verify Staged Release Artifacts
        run: |
          echo "Verifying staged release artifacts:"
          ls -la
          test -f "ASSella.AppImage" || { echo "::error::Missing ASSella.AppImage"; exit 1; }
          test -f "ASSella.AppImage.zsync" || { echo "::error::Missing ASSella.AppImage.zsync"; exit 1; }
          test -f "ASSella.AppImage.sha256" || { echo "::error::Missing ASSella.AppImage.sha256"; exit 1; }
          test -f "ASSella.AppImage.zsync.sha256" || { echo "::error::Missing ASSella.AppImage.zsync.sha256"; exit 1; }
          test -f "ASSella-arm64.AppImage" || { echo "::error::Missing ASSella-arm64.AppImage"; exit 1; }
          test -f "ASSella-arm64.AppImage.zsync" || { echo "::error::Missing ASSella-arm64.AppImage.zsync"; exit 1; }
          test -f "ASSella-arm64.AppImage.sha256" || { echo "::error::Missing ASSella-arm64.AppImage.sha256"; exit 1; }
          test -f "ASSella-arm64.AppImage.zsync.sha256" || { echo "::error::Missing ASSella-arm64.AppImage.zsync.sha256"; exit 1; }
          test -f "release_notes.md" || { echo "::error::Missing release_notes.md"; exit 1; }
          echo "All required multi-architecture release artifacts present and staged."

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: "ASSella ${{ needs.meta.outputs.tag }}"
          draft: ${{ needs.meta.outputs.draft == 'true' }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          body_path: ./release_notes.md
          generate_release_notes: false
          files: |
            ASSella.AppImage
            ASSella.AppImage.zsync
            ASSella.AppImage.sha256
            ASSella.AppImage.zsync.sha256
            ASSella-arm64.AppImage
            ASSella-arm64.AppImage.zsync
            ASSella-arm64.AppImage.sha256
            ASSella-arm64.AppImage.zsync.sha256
            ASSella-${{ needs.meta.outputs.tag }}-linux-source.tar.gz
            ASSella-${{ needs.meta.outputs.tag }}-linux-source.tar.gz.sha256
            ASSella-${{ needs.meta.outputs.tag }}-linux-source.zip
            ASSella-${{ needs.meta.outputs.tag }}-linux-source.zip.sha256
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror Release to Cloudflare R2
        if: >-
          github.repository == 'niwia/ASSella' &&
          (
            (needs.meta.outputs.channel == 'stable' && needs.meta.outputs.prerelease != 'true') ||
            needs.meta.outputs.channel == 'beta'
          ) &&
          needs.meta.outputs.draft != 'true'
        env:
          R2_RELEASES_ENDPOINT: ${{ secrets.R2_RELEASES_ENDPOINT }}
          R2_RELEASES_BUCKET: ${{ secrets.R2_RELEASES_BUCKET }}
          R2_RELEASES_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
          R2_RELEASES_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
          R2_RELEASES_PUBLIC_URL: ${{ secrets.R2_RELEASES_PUBLIC_URL }}
        run: |
          if [ -z "${R2_RELEASES_BUCKET:-}" ] || [ -z "${R2_RELEASES_ACCESS_KEY_ID:-}" ]; then
            echo "R2 release secrets not configured; skipping R2 mirror."
            exit 0
          fi
          pip install --no-input boto3
          TARGET_BRANCH="main"
          if [ "${{ needs.meta.outputs.channel }}" = "beta" ]; then
            TARGET_BRANCH="beta"
          fi
          python3 scripts/mirror_release_to_r2.py \
            --channel "${{ needs.meta.outputs.channel }}" \
            --target-commitish "$TARGET_BRANCH" \
            --tag "${{ needs.meta.outputs.tag }}" \
            --release-name "ASSella ${{ needs.meta.outputs.tag }}" \
            --dir .

      - name: Notify Discord of Release
        if: needs.meta.outputs.draft != 'true'
        env:
          DISCORD_WEBHOOK_BETA_URL: ${{ secrets.DISCORD_WEBHOOK_BETA_URL }}
          DISCORD_WEBHOOK_MAIN_URL: ${{ secrets.DISCORD_WEBHOOK_MAIN_URL }}
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
          RELEASE_CHANNEL: ${{ needs.meta.outputs.channel }}
          RELEASE_BODY_FILE: ./release_notes.md
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 scripts/notify_discord_release.py
