name: Build ARM64 AppImage (Armada OS / Handhelds)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish assets to GitHub Release'
        required: true
        default: false
        type: boolean
  push:
    branches:
      - arm64
    paths:
      - 'src/**'
      - 'scripts/build_arm64_appimage.sh'
      - 'requirements.txt'
      - 'requirements.in'
      - '.github/workflows/build-arm64.yml'

permissions:
  contents: write

jobs:
  build-arm64:
    name: Build Native ARM64 AppImage
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install System Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zsync squashfs-tools wget curl file git \
            libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libfontconfig1 libdbus-1-3

      - name: Build Standalone ARM64 AppImage
        run: |
          bash scripts/build_arm64_appimage.sh

      - name: Verify AppImage Execution (FUSE-free Smoke Test)
        run: |
          chmod +x ASSella-arm64.AppImage
          # Verify headless check-updates runs cleanly on native aarch64
          APPIMAGE_EXTRACT_AND_RUN=1 ./ASSella-arm64.AppImage --headless --check-updates
          echo "ARM64 AppImage smoke-test passed successfully!"

      - name: Upload ARM64 Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ASSella-arm64-AppImage
          path: |
            ASSella-arm64.AppImage
            ASSella-arm64.AppImage.sha256
            ASSella-arm64.AppImage.zsync

      - name: Publish to GitHub Release
        if: ${{ github.event.inputs.publish == 'true' || startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ASSella-arm64.AppImage
            ASSella-arm64.AppImage.sha256
            ASSella-arm64.AppImage.zsync
          fail_on_unmatched_files: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
