name: Auto-Sync Canary to ARM64

on:
  push:
    branches: [ canary ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fast-forward / Merge Canary into ARM64
        run: |
          git checkout arm64
          git merge origin/canary --no-edit -m "chore(sync): auto-merge canary into arm64 [skip ci]" || {
            echo "Auto-merge encountered conflicts. Aborting merge."
            git merge --abort
            exit 1
          }
          git push origin arm64
