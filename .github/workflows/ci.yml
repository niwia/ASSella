name: CI - Code Health & Syntax

on:
  push:
    branches: [ main, beta, canary ]
  pull_request:
    branches: [ main, beta, canary ]
  workflow_dispatch:

jobs:
  lint-and-validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile and Validate Python Syntax
        run: |
          echo "Compiling all python files to verify syntax integrity..."
          python -m py_compile src/main.py
          python -m compileall -q src/

      # compileall only proves the files parse. A missing dependency, a broken
      # import path, or a resource the app loads at startup would all pass it
      # and still produce an AppImage that will not launch. This mirrors the
      # check the release build performs against the bundled runtime.
      - name: Verify Runtime Imports and Headless Qt
        run: |
          python - <<'PY'
          import importlib, sys
          modules = [
              "PyQt6.QtCore", "PyQt6.QtWidgets", "PyQt6.QtGui",
              "requests", "yaml", "PIL", "cryptography", "configobj",
              "urwid", "vdf", "steam", "wsproto", "steam.client",
              "zstandard", "curl_cffi", "psutil", "bs4", "tinytag",
              "just_playback", "gevent", "capstone", "numpy",
          ]
          failed = []
          for name in modules:
              try:
                  importlib.import_module(name)
              except Exception as exc:
                  failed.append(f"{name}: {type(exc).__name__}: {exc}")
          if failed:
              print("::error::Unimportable runtime dependencies:")
              for line in failed:
                  print(f"  - {line}")
              sys.exit(1)
          print(f"All {len(modules)} runtime dependencies import cleanly.")

          # Exercise a real QApplication and the app's own resource loader, which
          # is where a missing res/ asset or a bad Paths base would surface.
          import os, tempfile
          os.environ.setdefault("QT_QPA_PLATFORM", "offscreen")
          os.environ.setdefault("XDG_RUNTIME_DIR", tempfile.gettempdir())
          sys.path.insert(0, "src")
          from PyQt6.QtWidgets import QApplication
          app = QApplication(["-platform", "offscreen"])
          from utils.paths import Paths
          print(f"Resource base: {Paths.BASE_DIR}")
          required = ["version", "logo/accela.png", "logo/icon.png"]
          missing = [r for r in required if not Paths.resource(r).exists()]
          if missing:
              print(f"::error::Missing required resources: {missing}")
              sys.exit(1)
          print("Headless QApplication created; required resources present.")
          PY

      # Reported, but deliberately not a blocking gate.
      #
      # This suite is written for a developer machine: several checks assert
      # against a real Steam installation, an installed SLSsteam config, and
      # manifests downloaded by an earlier phase. On a clean runner those fail
      # for environmental reasons, not because the code is broken - five such
      # checks fail with a fresh HOME. The blocking gate for "will this
      # AppImage launch" is the runtime-import and headless-Qt step above; the
      # release workflow additionally verifies the built artifact's integrity.
      - name: Run Pre-Release Verification Suite (informational)
        continue-on-error: true
        run: |
          ASSELLA_TESTER_NO_REEXEC=1 QT_QPA_PLATFORM=offscreen \
            python -u scripts/prerelease_check.py > /tmp/prerelease.log 2>&1 || true
          {
            echo "### Pre-Release Verification Suite"
            echo ""
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' /tmp/prerelease.log | grep -E 'RESULTS:|STATUS:|\[FAIL\]|\[SKIP\]' || true
            echo '```'
            echo ""
            echo "Non-blocking: this suite targets a developer machine with Steam and"
            echo "SLSsteam installed. See the step log for the full report."
          } >> "$GITHUB_STEP_SUMMARY"
          sed 's/\x1b\[[0-9;]*m//g' /tmp/prerelease.log | grep -E 'RESULTS:|STATUS:' || true
