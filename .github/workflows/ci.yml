name: CI - Code Health & Syntax

on:
  push:
    branches: [ main, beta, canary ]
  pull_request:
    branches: [ main, beta, canary ]
  workflow_dispatch:

jobs:
  lint-and-validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Lint (ruff)
        # F821/F823/F811 catch undefined names, use-before-assignment and
        # shadowed re-imports. Those are the bug classes that compile fine and
        # then raise NameError at runtime, which compileall cannot see.
        # Rule set and exclusions live in ruff.toml.
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          ruff check src/ --output-format=github
          echo "::group::Unused imports (advisory, non-blocking)"
          ruff check src/ --select F401 --statistics || true
          echo "::endgroup::"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile and Validate Python Syntax
        run: |
          echo "Compiling all python files to verify syntax integrity..."
          python -m py_compile src/main.py
          python -m compileall -q src/

      # compileall only proves the files parse. A missing dependency, a bad
      # import path, or a resource the app loads at startup would all pass it
      # and still produce an AppImage that will not launch. This is the same
      # check the release build performs against the bundled runtime.
      - name: Verify Runtime Imports and Headless Qt
        run: |
          python - <<'PY'
          import importlib, sys
          modules = [
              "PyQt6.QtCore", "PyQt6.QtWidgets", "PyQt6.QtGui",
              "requests", "yaml", "cryptography", "configobj",
              "urwid", "vdf", "steam", "steam.client",
              "zstandard", "curl_cffi", "psutil", "bs4",
              "gevent", "capstone",
          ]
          failed = []
          for name in modules:
              try:
                  importlib.import_module(name)
              except Exception as exc:
                  failed.append(f"{name}: {type(exc).__name__}: {exc}")
          if failed:
              print("::error::Unimportable runtime dependencies:")
              for line in failed:
                  print(f"  - {line}")
              sys.exit(1)
          print(f"All {len(modules)} runtime dependencies import cleanly.")

          # Exercise a real QApplication + the app's own resource loader, which
          # is where a missing res/ asset or bad Paths base would surface.
          import os, tempfile
          os.environ.setdefault("QT_QPA_PLATFORM", "offscreen")
          os.environ.setdefault("XDG_RUNTIME_DIR", tempfile.gettempdir())
          sys.path.insert(0, "src")
          from PyQt6.QtWidgets import QApplication
          app = QApplication(["-platform", "offscreen"])
          from utils.paths import Paths
          print(f"Resource base: {Paths.BASE_DIR}")
          required = ["version", "logo/accela.png", "logo/icon.png"]
          missing = [r for r in required if not Paths.resource(r).exists()]
          if missing:
              print(f"::error::Missing required resources: {missing}")
              sys.exit(1)
          print("Headless QApplication created; required resources present.")
          PY

      # The real gate. Imports all ~174 modules under src/ AND force-resolves
      # every annotation. Python 3.14 evaluates annotations lazily (PEP 649),
      # so a missing typing import imports fine locally and crashes the AppImage
      # (which ships 3.13). ruff cannot see that; this can. A missing declared
      # dependency is a failure here, not a skip.
      - name: Smoke Import Gate
        run: |
          ASSELLA_NO_REEXEC=1 QT_QPA_PLATFORM=offscreen \
            python -u scripts/smoke_import_check.py

      # Behavioural suites. These need no Steam install, no network and no
      # display, so they are safe to run on a clean runner and they cover the
      # logic that is easy to regress silently: depot->app mapping, the
      # config sync path, and the optional-component download/install/verify
      # pipeline (which includes a hard-crash regression test for the QThread
      # teardown that used to abort the process with SIGABRT).
      - name: Behavioural Test Suites
        run: |
          set -e
          for suite in test_depot_mapping test_atom_config_sync test_components_ui; do
            echo "::group::$suite"
            QT_QPA_PLATFORM=offscreen XDG_RUNTIME_DIR=/tmp \
              python -u "scripts/$suite.py"
            echo "::endgroup::"
          done

      - name: QThread Teardown Regression
        run: |
          # Runs in its own step because a Qt teardown failure is SIGABRT, which
          # aborts the whole runner process rather than failing one command.
          QT_QPA_PLATFORM=offscreen XDG_RUNTIME_DIR=/tmp \
            python -u scripts/test_manifest_worker.py close-while-running

      # Reported, but deliberately NOT a blocking gate.
      #
      # prerelease_check.py is written for a developer machine: several checks
      # assert against a real Steam installation, an installed SLSsteam config,
      # and manifests downloaded by an earlier phase. On a clean runner those
      # fail for environmental reasons, not because the code is broken, and
      # making this blocking would leave main/beta permanently red.
      #
      # Do not tighten this without first running it on a clean runner and
      # confirming the environmental checks skip rather than fail.
      - name: Run Pre-Release Verification Suite (informational)
        continue-on-error: true
        run: |
          ASSELLA_TESTER_NO_REEXEC=1 QT_QPA_PLATFORM=offscreen \
            python -u scripts/prerelease_check.py > /tmp/prerelease.log 2>&1 || true
          {
            echo "### Pre-Release Verification Suite"
            echo ""
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' /tmp/prerelease.log | grep -E 'RESULTS:|STATUS:|\[FAIL\]|\[SKIP\]' || true
            echo '```'
            echo ""
            echo "Non-blocking: targets a developer machine with Steam and"
            echo "SLSsteam installed. See the step log for the full report."
          } >> "$GITHUB_STEP_SUMMARY"
          sed 's/\x1b\[[0-9;]*m//g' /tmp/prerelease.log | grep -E 'RESULTS:|STATUS:' || true
