<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Stem -->
  <path d="M12 2 C12.5 4, 13.5 5, 14 5.5 C13 5.8, 12 5.5, 11 5.5 Z" fill="#2ed573"/>
  <!-- Pumpkin Outer Body -->
  <ellipse cx="12" cy="14" rx="10" ry="8" fill="#e65c00"/>
  <!-- Inner Ribs for 3D pumpkin shape -->
  <ellipse cx="12" cy="14" rx="7" ry="8" fill="#ff7518"/>
  <ellipse cx="12" cy="14" rx="3.8" ry="8" fill="#ff8c3b"/>
  <!-- Glowing Candle Light Features (Carved Cutouts with Yellow Candle Glow) -->
  <g filter="url(#glow)">
    <!-- Eyes -->
    <polygon points="7.5,11 9.5,11 8.5,13.2" fill="#fff700"/>
    <polygon points="14.5,11 16.5,11 15.5,13.2" fill="#fff700"/>
    <!-- Nose -->
    <polygon points="12,13.5 11.2,14.8 12.8,14.8" fill="#fff700"/>
    <!-- Carved Jagged Smiling Mouth -->
    <polygon points="6.8,15.8 8,17 9.5,15.8 11,17 12,15.8 13,17 14.5,15.8 16,17 17.2,15.8 16.5,18.2 12,19.5 7.5,18.2" fill="#fff700"/>
  </g>
</svg>
