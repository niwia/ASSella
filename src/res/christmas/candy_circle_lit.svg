<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <pattern id="candy-circ-lit" width="14" height="14" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="7" height="14" fill="#D32F2F"/>
      <rect x="7" width="7" height="14" fill="#FFFFFF"/>
    </pattern>
  </defs>
  <!-- Inner dark winter fill -->
  <circle cx="50" cy="50" r="33" fill="rgba(12, 16, 23, 0.75)"/>
  <!-- Candy cane ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#candy-circ-lit)" stroke-width="10"/>
  <!-- Outer and inner crisp red contour outlines -->
  <circle cx="50" cy="50" r="43" fill="none" stroke="#B71C1C" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="33" fill="none" stroke="#B71C1C" stroke-width="1.5"/>
  <!-- Candy cane checkmark shadow/border -->
  <polyline points="26,50 44,72 82,20" fill="none" stroke="#8E0000" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Candy cane checkmark pattern -->
  <polyline points="26,50 44,72 82,20" fill="none" stroke="url(#candy-circ-lit)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
</svg>